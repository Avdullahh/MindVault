<!DOCTYPE html>
<html>
  <body style="margin:0; padding:32px 16px; background-color:#f5f2ea; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; margin:0 auto; background-color:#ffffff; border-radius:12px; overflow:hidden;">
      <tr>
        <td style="padding:40px 32px 8px 32px; text-align:center;">
          <span style="font-size:20px; font-weight:700; letter-spacing:0.02em; color:#b8860b;">MindVault</span>
        </td>
      </tr>
      <tr>
        <td style="padding:8px 32px 24px 32px; text-align:center;">
          <h1 style="margin:0 0 12px 0; font-size:20px; line-height:28px; color:#1a1a1a;">Sign in to MindVault</h1>
          <p style="margin:0; font-size:15px; line-height:22px; color:#555555;">
            Tap the button below to finish signing in. This link works once and expires in 1 hour.
          </p>
        </td>
      </tr>
      <tr>
        <td style="padding:0 32px 32px 32px; text-align:center;">
          <a href="{{ .ConfirmationURL }}"
             style="display:inline-block; padding:14px 28px; background-color:#b8860b; color:#ffffff; font-size:15px; font-weight:600; text-decoration:none; border-radius:10px;">
            Continue to MindVault
          </a>
        </td>
      </tr>
      <tr>
        <td style="padding:0 32px 32px 32px; text-align:center;">
          <p style="margin:0 0 6px 0; font-size:13px; line-height:20px; color:#999999;">
            Button not working? Paste this link into your browser:
          </p>
          <p style="margin:0; font-size:13px; line-height:20px; word-break:break-all;">
            <a href="{{ .ConfirmationURL }}" style="color:#b8860b;">{{ .ConfirmationURL }}</a>
          </p>
        </td>
      </tr>
      <tr>
        <td style="padding:20px 32px; border-top:1px solid #eeeeee; text-align:center;">
          <p style="margin:0; font-size:12px; line-height:18px; color:#aaaaaa;">
            If you didn't request this, you can safely ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
